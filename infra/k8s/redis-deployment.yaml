# DEPRECATED placeholder manifest
# Use Helm chart (Bitnami) or a managed Redis in production. See infra/helm/README.md for recommended commands.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:6.2
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

# NOTE: This file is for quick local testing only. Replace with: 
# helm install market-redis bitnami/redis --set auth.existingSecret=<secret> --set persistence.enabled=true
