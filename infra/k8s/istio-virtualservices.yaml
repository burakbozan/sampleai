apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
spec:
  hosts:
  - "*"
  gateways:
  - mesh
  http:
  - match:
    - uri:
        prefix: "/api/products"
    route:
    - destination:
        host: product-service
        port:
          number: 80
  - match:
    - uri:
        prefix: "/api/orders"
    route:
    - destination:
        host: order-service
        port:
          number: 80
  - match:
    - uri:
        prefix: "/api/auth"
    route:
    - destination:
        host: auth-service
        port:
          number: 80
---
# Example of rate limiting via Envoy/Istio (placeholder) — real setup requires policy and telemetry adapters
# Use Istio RateLimit or Envoy external rate-limiter for production
