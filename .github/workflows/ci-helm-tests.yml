name: CI - Helm & Tests

on:
  push:
    branches: [ 'main', 'burakbozan-ecommerce-microservices' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Helm lint all charts
        run: |
          helm lint infra/helm/product-service || true
          helm lint infra/helm/order-service || true
          helm lint infra/helm/auth-service || true
          helm lint infra/helm/api-gateway || true
      - name: Helm template umbrella
        run: |
          cd infra/helm/ecommerce-chart
          helm dependency update || true
          helm template ecommerce-chart .

  maven-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [services/product-service, services/order-service, services/auth-service, gateway/api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Maven tests for module
        run: |
          mvn -f ${{ matrix.module }} -B -q test

  release:
    needs: [helm-lint, maven-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to Docker registry
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD && secrets.DOCKER_REGISTRY }}
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push images
        uses: docker/build-push-action@v4
        with:
          push: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD && secrets.DOCKER_REGISTRY }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/market-store/product-service:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/market-store/product-service:latest
            ${{ secrets.DOCKER_REGISTRY }}/market-store/order-service:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/market-store/order-service:latest
            ${{ secrets.DOCKER_REGISTRY }}/market-store/auth-service:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/market-store/auth-service:latest
            ${{ secrets.DOCKER_REGISTRY }}/market-store/api-gateway:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/market-store/api-gateway:latest
          file: ./Dockerfile
          context: .
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Package Helm charts
        run: |
          cd infra/helm/product-service && helm package . || true
          cd ../../order-service && helm package . || true
          cd ../../auth-service && helm package . || true
          cd ../../api-gateway && helm package . || true
      - name: Upload Helm packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: infra/helm/**/*.tgz
      - name: Push Helm to OCI (optional)
        if: ${{ secrets.HELM_REGISTRY && secrets.HELM_USERNAME && secrets.HELM_PASSWORD }}
        run: |
          helm registry login ${{ secrets.HELM_REGISTRY }} --username ${{ secrets.HELM_USERNAME }} --password ${{ secrets.HELM_PASSWORD }}
          for f in infra/helm/*/*.tgz; do helm push "$f" oci://${{ secrets.HELM_REGISTRY }} || true; done
