spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: product-route
          uri: http://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - name: RemoveRequestHeader
              args:
                headerName: Cookie
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
        - id: order-route
          uri: http://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
        - id: auth-route
          uri: http://auth-service
          predicates:
            - Path=/api/auth/**
management:
  endpoints:
    web:
      exposure:
        include: "*"

# Redis configuration for RequestRateLimiter (assumes Redis is available in the cluster)
spring:
  redis:
    host: redis
    port: 6379
